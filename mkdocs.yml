site_name: VecAPI Backend Docs
site_description: FastAPI backend for Financials_RAG — ingestion, storage (S3), vector, and RAG agents.
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - content.code.select
plugins:
  - search
nav:
  - Home: index.md
  - Architecture:
      - System Architecture: architecture.md
      - Ingestion Pipeline: ingestion.md
      - Parsers: parsers.md
      - Vector Store: vector.md
      - RAG Agent: rag.md
  - API Guide: api.md
  - Getting Started:
      - Development Workflow: dev_guide.md
      - Configuration: configuration.md
  - Operations:
      - Deployment: operations/deployment.md
      - Dramatiq Worker: operations/dramatiq.md
      - Runbooks: operations/runbooks.md
  - Observability:
      - Overview: observability.md
      - OpenTelemetry: opentelemetry.md
  - Reference:
      - UploadService: reference/upload_service.md
      - JobService: reference/job_service.md
      - DocumentService: reference/document_service.md
      - DocumentIngestor: reference/document_ingestor.md
      - IngestionRepository: reference/ingestion_repository.md
      - S3Store: reference/s3_store.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.emoji
extra:
  generator: false
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
