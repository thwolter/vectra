[databases]
vectra = host=vectra-db port=5432 dbname=vectra pool_size=40

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 500
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path
log_connections = 1
log_disconnections = 1
