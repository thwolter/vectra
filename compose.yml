x-vectra-common: &vectra-common
  build:
    context: ./
  depends_on:
    redis:
      condition: service_healthy
    vectra-db:
      condition: service_healthy
  environment: &vectra-env
    POSTGRES_URL: postgresql://app_user:app-password@vectra-db:5432/vectra
    ALEMBIC_DATABASE_URL: postgresql://alembic_user:alembic-password@vectra-db:5432/vectra
    REDIS_URL: redis://:redispassword@redis:6379/0
    DRAMATIQ_BROKER_URL: redis://:redispassword@redis:6379/0
  env_file:
    - .env
  networks:
    - vectra-net
  volumes:
    - /tmp/vectra/documents:/tmp/vectra/documents
  develop:
    watch:
      - action: sync
        path: src
        target: /src/src
      - action: sync
        path: ./scripts
        target: /src/scripts
      - action: sync
        path: ./alembic
        target: /src/alembic
      - action: sync
        path: ./alembic.ini
        target: /src/alembic.ini
      - action: rebuild
        path: ./pyproject.toml
      - action: rebuild
        path: ./uv.lock

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - redispassword
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispassword', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vectra-net
    volumes:
      - redis-data:/data

  vectra-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vectra']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    networks:
      - vectra-net
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - vectra-db-data:/var/lib/postgresql/data

  vectra-app:
    <<: *vectra-common
    environment:
      <<: *vectra-env
      START_WORKER: 'false'
      PORT: 8000
    ports:
      - '8000:8000'

  vectra-worker:
    <<: *vectra-common
    environment:
      <<: *vectra-env
      START_WEB: 'false'
      DEPLOY_SKIP_MIGRATIONS: 'true'

volumes:
  redis-data:
  vectra-db-data:

networks:
  vectra-net:
    driver: bridge
